<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="832" viewBox="0 0 920 832" role="img" aria-labelledby="title desc">
  <title id="title">The HOA Fine Appeal Process Step by Step</title>
  <desc id="desc">MyHOAAppeal branded Process flowchart infographic</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="920" height="832" fill="url(#bgGrad)"/>
  <rect width="920" height="832" fill="url(#dotGrid)" opacity="0.35"/>
  <rect x="24" y="24" width="872" height="784" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="52" cy="56" r="10" fill="url(#accentGrad)"/>
  <path d="M48 56 l3 3 6-7" fill="none" stroke="#020617" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="52" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">MyHOAAppeal</text>
  <text x="72" y="70" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="500">PROCESS FLOWCHART</text>
  
  <text x="56" y="88" font-family="system-ui,Segoe UI,sans-serif"><tspan x="56" dy="0" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="start">Interactive process timeline: HOA Fine Appeal Process Step by Step</tspan></text>
  
      <g>
        <rect x="56" y="136" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="164" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="169" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">1</text>
        <text x="112" y="162" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Capture the trigger</tspan></text>
        <rect x="714" y="150" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="166" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">Same day (30–90</text>
        <text x="112" y="188" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Save the notice, portal message, invoice, or verbal summary that started the dispute</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">about the full path from notice to written decision. Note the date received.</tspan></text>
        <line x1="84" y1="228" x2="84" y2="246" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <g>
        <rect x="56" y="246" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="274" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="279" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">2</text>
        <text x="112" y="272" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Pull controlling text</tspan></text>
        <rect x="714" y="260" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="276" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">1–3 days</text>
        <text x="112" y="298" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Locate the statute, CC&amp;R, rule, and fine-schedule language that supposedly authorizes</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">action on the full path from notice to written decision.</tspan></text>
        <line x1="84" y1="338" x2="84" y2="356" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <g>
        <rect x="56" y="356" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="384" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="389" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">3</text>
        <text x="112" y="382" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Build the evidence spine</tspan></text>
        <rect x="714" y="370" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="386" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">2–5 days</text>
        <text x="112" y="408" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Assemble dated photos, correspondence, ledgers, and comparables that speak directly to</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">which appeal stage you are in now.</tspan></text>
        <line x1="84" y1="448" x2="84" y2="466" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <g>
        <rect x="56" y="466" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="494" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="499" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">4</text>
        <text x="112" y="492" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Choose the procedural path</tspan></text>
        <rect x="714" y="480" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="496" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">Per notice window</text>
        <text x="112" y="518" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Pick cure, informal dispute, formal hearing, payment under protest, ADR, or counsel</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">based on deadlines and stakes around the full path from notice to written decision.</tspan></text>
        <line x1="84" y1="558" x2="84" y2="576" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <g>
        <rect x="56" y="576" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="604" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="609" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">5</text>
        <text x="112" y="602" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Submit a written ask</tspan></text>
        <rect x="714" y="590" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="606" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">1–2 hours to</text>
        <text x="112" y="628" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Send one clear remedy request (waive, reduce, re-notice, or reverse) tied to which</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">appeal stage you are in now, with exhibits attached.</tspan></text>
        <line x1="84" y1="668" x2="84" y2="686" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <g>
        <rect x="56" y="686" width="808" height="92" rx="14" fill="#111827" stroke="#334155"/>
        <circle cx="84" cy="714" r="16" fill="url(#accentGrad)"/>
        <text x="84" y="719" text-anchor="middle" fill="#020617" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">6</text>
        <text x="112" y="712" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="start">Confirm the outcome in writing</tspan></text>
        <rect x="714" y="700" width="136" height="24" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="782" y="716" text-anchor="middle" fill="#34d399" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">1–7 days after</text>
        <text x="112" y="738" font-family="system-ui,Segoe UI,sans-serif"><tspan x="112" dy="0" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Demand or calendar a written decision, update your ledger notes, and decide whether</tspan><tspan x="112" dy="18" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">escalation is still proportionate.</tspan></text>
        
      </g>
</svg>
