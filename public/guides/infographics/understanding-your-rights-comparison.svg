<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="614" viewBox="0 0 980 614" role="img" aria-labelledby="title desc">
  <title id="title">Understanding Your Rights When an HOA Fines You</title>
  <desc id="desc">MyHOAAppeal branded Comparison infographic</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="980" height="614" fill="url(#bgGrad)"/>
  <rect width="980" height="614" fill="url(#dotGrid)" opacity="0.35"/>
  <rect x="24" y="24" width="932" height="566" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="52" cy="56" r="10" fill="url(#accentGrad)"/>
  <path d="M48 56 l3 3 6-7" fill="none" stroke="#020617" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="52" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">MyHOAAppeal</text>
  <text x="72" y="70" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="500">COMPARISON</text>
  
  <text x="56" y="88" font-family="system-ui,Segoe UI,sans-serif"><tspan x="56" dy="0" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="start">Comparison: Valid notice vs Defective notice vs No written notice</tspan></text>
  
      <rect x="206" y="120" width="232.66666666666666" height="64" rx="12" fill="#064e3b" stroke="#059669"/>
      <text x="322.3333333333333" y="148" font-family="system-ui,Segoe UI,sans-serif"><tspan x="322.3333333333333" dy="0" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Valid notice</tspan></text>
      <rect x="450.66666666666663" y="120" width="232.66666666666666" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="567" y="148" font-family="system-ui,Segoe UI,sans-serif"><tspan x="567" dy="0" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Defective notice</tspan></text>
      <rect x="695.3333333333333" y="120" width="232.66666666666666" height="64" rx="12" fill="#3f1d1d" stroke="#9a3412"/>
      <text x="811.6666666666666" y="148" font-family="system-ui,Segoe UI,sans-serif"><tspan x="811.6666666666666" dy="0" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">No written notice</tspan></text>
  
      <text x="48" y="224" font-family="system-ui,Segoe UI,sans-serif"><tspan x="48" dy="0" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">Typical signal</tspan></text>
      
        <rect x="206" y="196" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="218" y="220" font-family="system-ui,Segoe UI,sans-serif"><tspan x="218" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Clear written basis for</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">valid notice</tspan></text>
        <rect x="450.66666666666663" y="196" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="462.66666666666663" y="220" font-family="system-ui,Segoe UI,sans-serif"><tspan x="462.66666666666663" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Partial or contested</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">basis for defective</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">notice</tspan></text>
        <rect x="695.3333333333333" y="196" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="707.3333333333333" y="220" font-family="system-ui,Segoe UI,sans-serif"><tspan x="707.3333333333333" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">High risk if you only</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">have no written notice</tspan></text>
      <text x="48" y="302" font-family="system-ui,Segoe UI,sans-serif"><tspan x="48" dy="0" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">Owner priority</tspan></text>
      
        <rect x="206" y="274" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="218" y="298" font-family="system-ui,Segoe UI,sans-serif"><tspan x="218" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Preserve valid notice</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">with indexed proof</tspan></text>
        <rect x="450.66666666666663" y="274" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="462.66666666666663" y="298" font-family="system-ui,Segoe UI,sans-serif"><tspan x="462.66666666666663" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Convert defective notice</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">into a documented record</tspan></text>
        <rect x="695.3333333333333" y="274" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="707.3333333333333" y="298" font-family="system-ui,Segoe UI,sans-serif"><tspan x="707.3333333333333" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Do not rely on no</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">written notice alone</tspan></text>
      <text x="48" y="380" font-family="system-ui,Segoe UI,sans-serif"><tspan x="48" dy="0" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">Board / manager</tspan><tspan x="48" dy="15" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">reaction</tspan></text>
      
        <rect x="206" y="352" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="218" y="376" font-family="system-ui,Segoe UI,sans-serif"><tspan x="218" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Harder to dismiss when</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">exhibits are complete</tspan></text>
        <rect x="450.66666666666663" y="352" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="462.66666666666663" y="376" font-family="system-ui,Segoe UI,sans-serif"><tspan x="462.66666666666663" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">May stall or ask for</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">more information</tspan></text>
        <rect x="695.3333333333333" y="352" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="707.3333333333333" y="376" font-family="system-ui,Segoe UI,sans-serif"><tspan x="707.3333333333333" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Often treated as</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">insufficient without</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">follow-up writing</tspan></text>
      <text x="48" y="458" font-family="system-ui,Segoe UI,sans-serif"><tspan x="48" dy="0" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">Next educational</tspan><tspan x="48" dy="15" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">move</tspan></text>
      
        <rect x="206" y="430" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="218" y="454" font-family="system-ui,Segoe UI,sans-serif"><tspan x="218" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Advance the formal path</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">for notice, cure,</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">hearing, and written</tspan></text>
        <rect x="450.66666666666663" y="430" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="462.66666666666663" y="454" font-family="system-ui,Segoe UI,sans-serif"><tspan x="462.66666666666663" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Send a clarifying letter</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">addressing whether your</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">notice meets procedural</tspan></text>
        <rect x="695.3333333333333" y="430" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="707.3333333333333" y="454" font-family="system-ui,Segoe UI,sans-serif"><tspan x="707.3333333333333" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Collect missing</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">documents before arguing</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">substance</tspan></text>
      <text x="48" y="536" font-family="system-ui,Segoe UI,sans-serif"><tspan x="48" dy="0" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">Escalation risk</tspan><tspan x="48" dy="15" fill="#34d399" font-size="12" font-weight="650" text-anchor="start">if ignored</tspan></text>
      
        <rect x="206" y="508" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="218" y="532" font-family="system-ui,Segoe UI,sans-serif"><tspan x="218" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Lower if you stay on</tspan><tspan x="218" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">deadline</tspan></text>
        <rect x="450.66666666666663" y="508" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="462.66666666666663" y="532" font-family="system-ui,Segoe UI,sans-serif"><tspan x="462.66666666666663" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Medium — ambiguity can</tspan><tspan x="462.66666666666663" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">harden into denial</tspan></text>
        <rect x="695.3333333333333" y="508" width="232.66666666666666" height="68" rx="10" fill="#111827" stroke="#1e293b"/>
        <text x="707.3333333333333" y="532" font-family="system-ui,Segoe UI,sans-serif"><tspan x="707.3333333333333" dy="0" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Higher — no written</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">notice gaps feed</tspan><tspan x="707.3333333333333" dy="15" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">collections narratives</tspan></text>
</svg>
